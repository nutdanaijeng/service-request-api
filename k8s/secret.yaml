# Demo values for a local cluster only.
# In a real environment, create secrets out-of-band (kubectl create secret,
# Sealed Secrets, External Secrets, etc.) and never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: secret
  POSTGRES_DB: appdb
  DATABASE_URL: postgresql://app:secret@postgres:5432/appdb
